<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Driftwick</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <button id="hud-settings" class="hud-icon-btn" aria-label="Réglages">⚙</button>
  <button id="hud-photo" class="hud-icon-btn" aria-label="Mode photo">📷</button>
  <p id="hud-hint">Touchez pour construire · glissez pour tourner · pincez pour zoomer</p>
  <div id="hud-panel" hidden>
    <label><input type="checkbox" id="hud-sound"> Son</label>
    <label><input type="checkbox" id="hud-vibration"> Vibration</label>
    <select id="hud-world-select"></select>
    <button id="hud-world-new">Nouveau monde</button>
    <button id="hud-export">Exporter ce monde</button>
    <button id="hud-import">Importer un monde</button>
    <input type="file" id="hud-import-file" accept="application/json" hidden>
    <button id="hud-reset">Recommencer ce monde</button>
    <button id="hud-close">Fermer</button>
  </div>
  <div id="photo-vignette" hidden></div>
  <div id="photo-bar" hidden>
    <input type="range" id="photo-time" min="0" max="1" step="0.01" aria-label="Heure du jour">
    <div id="photo-filters">
      <button data-filter="none" class="active">Aucun</button>
      <button data-filter="sepia">Sépia</button>
      <button data-filter="mono">N&amp;B</button>
      <button data-filter="vignette">Vignette</button>
    </div>
    <div id="photo-actions">
      <button id="photo-capture">Capturer</button>
      <button id="photo-share" hidden>Partager</button>
    </div>
  </div>
</div>

<script src="assets/lib/three.min.js"></script>
<script src="src/core/grid.js"></script>
<script src="src/topology/mesher.js"></script>
<script src="src/geometry/buildCellGeometry.js"></script>
<script src="src/rendering/materials.js"></script>
<script src="src/rendering/dayNight.js"></script>
<script src="src/decoration/placement.js"></script>
<script src="src/camera/orbitCamera.js"></script>
<script src="src/input/gestures.js"></script>
<script src="src/input/haptics.js"></script>
<script src="src/audio/audio.js"></script>
<script src="src/procedural/islands.js"></script>
<script src="src/save/save.js"></script>
<script src="src/procedural/world.js"></script>
<script src="src/ui/hud.js"></script>
<script src="game.js"></script>
</body>
</html>
